name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check that the tag matches the manifest version
        run: |
          version=$(python3 -c "import json; print(json.load(open('custom_components/geocover/manifest.json'))['version'])")
          if [ "v${version}" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match manifest version ${version}"
            exit 1
          fi
      - name: Build the archive
        run: cd custom_components/geocover && zip -r "${GITHUB_WORKSPACE}/geocover.zip" . -x '__pycache__/*'
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" geocover.zip --generate-notes --verify-tag

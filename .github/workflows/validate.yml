name: Validate

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.14"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: pre-commit/action@v3.0.1

  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: home-assistant/actions/hassfest@master

  hacs:
    runs-on: ubuntu-latest
    steps:
      - uses: hacs/action@main
        with:
          category: integration

  typing:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            requirements_test.txt
            ci/requirements_test_min.txt
      - name: Install dependencies
        run: |
          python scripts/manifest_requirements.py > requirements_manifest.txt
          pip install -r requirements_test.txt -r requirements_manifest.txt
      - run: mypy

  tests:
    name: tests (HA ${{ matrix.homeassistant }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # "minimum" (ci/requirements_test_min.txt) must match hacs.json;
        # "latest" follows requirements_test.txt.
        homeassistant: [minimum, latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            requirements_test.txt
            ci/requirements_test_min.txt
      - name: Install dependencies
        run: |
          python scripts/manifest_requirements.py > requirements_manifest.txt
          if [ "${{ matrix.homeassistant }}" = minimum ]; then
            pip install -r ci/requirements_test_min.txt -r requirements_manifest.txt
            installed=$(pip show homeassistant | sed -n 's/^Version: //p')
            declared=$(python -c "import json; print(json.load(open('hacs.json'))['homeassistant'])")
            if [ "$installed" != "$declared" ]; then
              echo "::error::hacs.json declares $declared but the minimum tests run on $installed"
              exit 1
            fi
          else
            pip install -r requirements_test.txt -r requirements_manifest.txt
          fi
          pip list | grep -iE "^(homeassistant|pytest-homeassistant-custom-component|pygeocover) "
      - name: Run tests
        run: |
          if [ "${{ matrix.homeassistant }}" = minimum ]; then
            # Entity snapshots depend on the Home Assistant version.
            pytest -q -m "not latest_ha_only" --snapshot-warn-unused
          else
            pytest -q --cov --cov-report=term-missing --cov-report=xml --snapshot-update
          fi
      - name: Print generated snapshots (temporary)
        if: always() && matrix.homeassistant == 'latest'
        run: for f in $(find tests -name "*.ambr"); do echo "=====FILE $f"; sed 's/^/|/' "$f"; done
      - uses: actions/upload-artifact@v4
        if: matrix.homeassistant == 'latest'
        with:
          name: coverage
          path: coverage.xml

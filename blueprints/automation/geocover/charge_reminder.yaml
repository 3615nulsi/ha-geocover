blueprint:
  name: Geocover — charge reminder
  description: >-
    Reminds you in the evening to charge the bike when its range is low and the next
    day is a working day (according to a Workday binary sensor).
  domain: automation
  source_url: https://github.com/3615nulsi/ha-geocover/blob/main/blueprints/automation/geocover/charge_reminder.yaml
  input:
    range_sensor:
      name: Bike range
      selector:
        entity:
          filter:
            integration: geocover
            domain: sensor
            device_class: distance
    min_range:
      name: Minimum range (km)
      default: 20
      selector:
        number:
          min: 5
          max: 150
          unit_of_measurement: km
    reminder_time:
      name: Reminder time
      default: "20:00:00"
      selector:
        time:
    tomorrow_workday:
      name: '"Tomorrow is a working day" sensor (Workday integration, days offset 1)'
      selector:
        entity:
          filter:
            domain: binary_sensor
            integration: workday
    charging_sensor:
      name: Bike "Charging" sensor
      selector:
        entity:
          filter:
            integration: geocover
            domain: binary_sensor
            device_class: battery_charging
    notify_device:
      name: Device to notify
      selector:
        device:
          filter:
            integration: mobile_app
mode: single
triggers:
  - trigger: time
    at: !input reminder_time
conditions:
  - condition: state
    entity_id: !input tomorrow_workday
    state: "on"
  - condition: state
    entity_id: !input charging_sensor
    state: "off"
  - condition: numeric_state
    entity_id: !input range_sensor
    below: !input min_range
actions:
  - domain: mobile_app
    type: notify
    device_id: !input notify_device
    title: "🔌 Charge the bike"
    message: "The range is low for tomorrow's commute."

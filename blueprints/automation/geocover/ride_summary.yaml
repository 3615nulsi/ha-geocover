blueprint:
  name: Geocover — ride summary
  description: Sends the summary of each ride when it is over.
  domain: automation
  source_url: https://github.com/3615nulsi/ha-geocover/blob/main/blueprints/automation/geocover/ride_summary.yaml
  input:
    ride_event:
      name: Bike "Ride" event
      selector:
        entity:
          filter:
            integration: geocover
            domain: event
    notify_device:
      name: Device to notify
      selector:
        device:
          filter:
            integration: mobile_app
mode: queued
variables:
  ride_event: !input ride_event
triggers:
  - trigger: state
    entity_id: !input ride_event
    not_from: unavailable
conditions:
  - condition: template
    value_template: "{{ state_attr(ride_event, 'event_type') == 'ride_finished' }}"
actions:
  - domain: mobile_app
    type: notify
    device_id: !input notify_device
    title: "🚲 Ride finished"
    message: >-
      {{ state_attr(ride_event, 'distance_km') }} km in
      {{ state_attr(ride_event, 'duration_min') }} min,
      {{ state_attr(ride_event, 'average_speed_kmh') }} km/h on average,
      {{ state_attr(ride_event, 'elevation_gain_m') }} m climbed.

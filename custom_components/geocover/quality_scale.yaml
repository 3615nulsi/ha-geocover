# Self-assessment against the Home Assistant Integration Quality Scale:
# https://developers.home-assistant.io/docs/core/integration-quality-scale/
# This is a custom integration: the scale is not awarded, it is used as a checklist.
rules:
  # Bronze
  action-setup: done
  appropriate-polling:
    status: done
    comment: >-
      Adaptive: 1 minute while riding, 5 minutes otherwise, 15 minutes when the
      bikes have been still for hours; health and latest ride hourly or when a ride
      ends. The bike only reports when it moves or connects.
  brands: done
  common-modules: done
  config-flow: done
  config-flow-test-coverage: done
  dependency-transparency: done
  docs-actions: done
  docs-high-level-description: done
  docs-installation-instructions: done
  docs-removal-instructions: done
  entity-event-setup:
    status: exempt
    comment: Entities are updated by the coordinator only.
  entity-unique-id: done
  has-entity-name: done
  runtime-data: done
  test-before-configure: done
  test-before-setup: done
  unique-config-entry: done

  # Silver
  action-exceptions: done
  config-entry-unloading: done
  docs-configuration-parameters:
    status: exempt
    comment: The integration has no options.
  docs-installation-parameters: done
  entity-unavailable: done
  integration-owner: done
  log-when-unavailable: done
  parallel-updates: done
  reauthentication-flow: done
  test-coverage: done

  # Gold
  devices: done
  diagnostics: done
  discovery:
    status: exempt
    comment: Cloud service, nothing to discover on the network.
  discovery-update-info:
    status: exempt
    comment: Cloud service, nothing to discover on the network.
  docs-data-update: done
  docs-examples: done
  docs-known-limitations: done
  docs-supported-devices: done
  docs-supported-functions: done
  docs-troubleshooting: done
  docs-use-cases: done
  dynamic-devices: done
  entity-category: done
  entity-device-class: done
  entity-disabled-by-default: done
  entity-translations: done
  exception-translations: done
  icon-translations: done
  reconfiguration-flow:
    status: exempt
    comment: There is nothing to reconfigure; a new sign-in is a reauthentication.
  repair-issues:
    status: done
    comment: Low GPS tracker battery, tracker silent for days, bike reported stolen.
  stale-devices: done

  # Platinum
  async-dependency: done
  inject-websession: done
  strict-typing: done
